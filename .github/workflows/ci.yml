name: PokeGuide CI Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ 【entity-github¦canonical_name=GitHub】.workflow }}-${{ 【entity-github¦canonical_name=GitHub】.ref }}
  cancel-in-progress: true

jobs:
  quality-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint & Format Check
        run: |
          pnpm lint
          pnpm format:check

      - name: Unit, Integration & Regression Tests (with Coverage)
        run: pnpm test -- --coverage

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Production Build
        run: pnpm build